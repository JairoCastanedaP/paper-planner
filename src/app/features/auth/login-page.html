<main class="auth">
  <a class="back" routerLink="/">← Volver al inicio</a>
  <section class="card">
    <p class="kicker">Paper Planner</p>
    <h1>Iniciar sesión</h1>
    <p class="lead">Tu calendario de papel, ahora en todos tus dispositivos.</p>

    <form (ngSubmit)="submit()">
      <label>
        Correo electrónico
        <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required autofocus />
      </label>
      <label>
        Contraseña
        <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
      </label>
      <a class="forgot" routerLink="/recuperar" [queryParams]="email.trim() ? { email: email.trim() } : {}">¿Olvidaste tu contraseña?</a>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="primary" [disabled]="busy()">{{ busy() ? 'Entrando…' : 'Entrar' }}</button>
    </form>

    <p class="switch">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    <p class="switch demo">
      ¿Solo quieres conocerla? <button type="button" class="link" (click)="demo()">Ver la demo sin cuenta</button>
    </p>
  </section>
</main>
