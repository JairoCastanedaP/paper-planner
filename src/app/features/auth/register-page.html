<main class="auth">
  <a class="back" routerLink="/">← Volver al inicio</a>
  <section class="card">
    <p class="kicker">Paper Planner</p>
    <h1>Crear cuenta</h1>

    <p class="lead">Organiza tu mes como en papel, con marcador de colores.</p>

    <form (ngSubmit)="submit()" #form="ngForm">
      <label>
        Nombre
        <input name="name" [(ngModel)]="name" autocomplete="name" required autofocus />
      </label>
      <label>
        Correo electrónico
        <input name="email" type="email" [(ngModel)]="email" autocomplete="email" required email />
      </label>
      <label>
        Contraseña
        <input name="password" type="password" [(ngModel)]="password" autocomplete="new-password" required minlength="6" />
      </label>
      <label>
        Confirmar contraseña
        <input name="confirm" type="password" [(ngModel)]="confirm" autocomplete="new-password" required />
      </label>

      <label class="consent">
        <input type="checkbox" name="accepted" [(ngModel)]="accepted" required />
        <span>
          Acepto los <a routerLink="/terminos" target="_blank">Términos y Condiciones</a> y autorizo el
          tratamiento de mis datos según la
          <a routerLink="/privacidad" target="_blank">Política de Tratamiento de Datos</a>, incluidos los
          datos sensibles que decida registrar y su almacenamiento en servidores fuera de Colombia.
        </span>
      </label>

      @if (mismatch) {
        <p class="error" role="alert">Las contraseñas no coinciden.</p>
      }
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="primary" [disabled]="form.invalid || mismatch || busy()">{{ busy() ? 'Creando…' : 'Crear cuenta' }}</button>
    </form>

    <p class="switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
