<div class="backdrop" (click)="closed.emit()"></div>

<aside class="panel" role="dialog" aria-modal="true" [attr.aria-label]="title()">
  <header [class.with-image]="image()" [style.--bg]="image() ? 'url(' + image() + ')' : null">
    <div>
      <h2>{{ title() }}</h2>
      <div class="badges">
        @if (holiday(); as name) {
          <span class="badge holiday">Festivo · {{ name }}</span>
        }
        @for (c of commemorations(); track c.name) {
          <span class="badge">{{ c.emoji }} {{ c.name }}</span>
        }
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="expand" (click)="expanded.emit(date())" title="Ver día completo">⤢ Día</button>
      <button type="button" class="close" (click)="closed.emit()" aria-label="Cerrar">×</button>
    </div>
  </header>

  <app-day-detail [date]="date()" />
</aside>
